# helm/microservices/values-prod.yaml
# Override: helm upgrade microservices ./helm/microservices -f helm/microservices/values-prod.yaml

global:
  registry:    "123456789012.dkr.ecr.us-east-1.amazonaws.com"
  imageTag:    "abc12345"   # replaced by CI/CD with git SHA
  environment: prod

services:
  auth:
    replicas: 3
    hpa:
      minReplicas: 3
      maxReplicas: 12

  user:
    replicas: 3

  product:
    replicas: 3

  order:
    replicas: 3

  payment:
    replicas: 3
    resources:
      requests: { cpu: "200m", memory: "384Mi" }
      limits:   { cpu: "800m", memory: "768Mi" }

  notification:
    replicas: 2
