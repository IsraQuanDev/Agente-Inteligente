{{/* helm/microservices/templates/deployment.yaml */}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}-service
    version: {{ $.Values.global.imageTag | quote }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
    environment: {{ $.Values.global.environment }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $name }}-service
        version: {{ $.Values.global.imageTag | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
    spec:
      serviceAccountName: {{ $name }}-service
      {{- if $.Values.topologySpreadEnabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ $.Values.topologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ $name }}-service
      {{- end }}
      containers:
        - name: {{ $name }}-service
          image: "{{ $.Values.global.registry }}/{{ $svc.image }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: AWS_REGION
              value: {{ $.Values.global.awsRegion }}
            - name: LOG_LEVEL
              value: info
            {{- if eq $name "auth" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secrets.jwt }}
                  key: jwt-secret
            - name: JWT_EXPIRES_IN
              value: {{ $svc.env.JWT_EXPIRES_IN | quote }}
            {{- end }}
            {{- if ne $name "notification" }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secrets.db }}
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secrets.db }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secrets.db }}
                  key: password
            {{- end }}
            {{- if or (eq $name "auth") (eq $name "user") (eq $name "product") }}
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secrets.redis }}
                  key: host
            {{- end }}
            {{- if or (eq $name "auth") (eq $name "user") (eq $name "product") (eq $name "order") (eq $name "payment") }}
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secrets.jwt }}
                  key: jwt-issuer
            {{- end }}
            {{- if or (eq $name "order") (eq $name "payment") }}
            - name: SNS_TOPIC_ARN
              value: {{ $.Values.global.aws.snsTopicArn }}
            {{- end }}
            {{- if eq $name "order" }}
            - name: ORDER_QUEUE_URL
              value: {{ $.Values.global.aws.orderQueue }}
            {{- end }}
            {{- if eq $name "payment" }}
            - name: PAYMENT_QUEUE_URL
              value: {{ $.Values.global.aws.paymentQueue }}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secrets.payment }}
                  key: stripe-secret-key
            {{- end }}
            {{- if or (eq $name "product") (eq $name "notification") }}
            - name: S3_BUCKET
              value: {{ $.Values.global.aws.s3Bucket }}
            {{- end }}
            {{- if eq $name "notification" }}
            - name: NOTIFICATION_QUEUE_URL
              value: {{ $.Values.global.aws.notifQueue }}
            {{- end }}
          resources:
            requests:
              cpu:    {{ $svc.resources.requests.cpu }}
              memory: {{ $svc.resources.requests.memory }}
            limits:
              cpu:    {{ $svc.resources.limits.cpu }}
              memory: {{ $svc.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            runAsNonRoot:             {{ $.Values.podSecurityContext.runAsNonRoot }}
            runAsUser:                {{ $.Values.podSecurityContext.runAsUser }}
            allowPrivilegeEscalation: {{ $.Values.podSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem:   {{ $.Values.podSecurityContext.readOnlyRootFilesystem }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: {{ $name }}-service
{{- end }}
{{- end }}
