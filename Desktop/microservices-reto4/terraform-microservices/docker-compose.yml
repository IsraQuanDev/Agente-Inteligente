version: "3.9"

# ── Local dev stack: all 6 services + Postgres + Redis + LocalStack ──
# Usage: docker compose up -d
# Auth URL: http://localhost:8080
# API URL:  http://localhost:8080 (via Nginx gateway below)

services:
  # ── Infrastructure ─────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       microservicesdb
      POSTGRES_USER:     dbadmin
      POSTGRES_PASSWORD: localdevpassword
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/migrations.sql:/docker-entrypoint-initdb.d/01-migrations.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dbadmin", "-d", "microservicesdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save ""
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  localstack:
    image: localstack/localstack:3
    ports: ["4566:4566"]
    environment:
      SERVICES: sqs,sns,s3,ses,secretsmanager
      DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localstack
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      retries: 5

  # ── Microservices ──────────────────────────────
  auth-service:
    build: ./services/auth
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_USER: dbadmin
      DB_PASSWORD: localdevpassword
      DB_NAME: microservicesdb
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-change-in-production-32chars
      JWT_ISSUER: http://localhost:8080
      JWT_EXPIRES_IN: 3600
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  user-service:
    build: ./services/user
    ports: ["8081:8081"]
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_USER: dbadmin
      DB_PASSWORD: localdevpassword
      DB_NAME: microservicesdb
      REDIS_HOST: redis
      JWT_ISSUER: http://localhost:8080
      AWS_REGION: us-east-1
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  product-service:
    build: ./services/product
    ports: ["8082:8082"]
    environment:
      PORT: 8082
      DB_HOST: postgres
      DB_USER: dbadmin
      DB_PASSWORD: localdevpassword
      DB_NAME: microservicesdb
      REDIS_HOST: redis
      S3_BUCKET: ms-reto4-dev-assets
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres: { condition: service_healthy }

  order-service:
    build: ./services/order
    ports: ["8083:8083"]
    environment:
      PORT: 8083
      DB_HOST: postgres
      DB_USER: dbadmin
      DB_PASSWORD: localdevpassword
      DB_NAME: microservicesdb
      ORDER_QUEUE_URL: http://localstack:4566/000000000000/ms-reto4-dev-order-events
      SNS_TOPIC_ARN:   arn:aws:sns:us-east-1:000000000000:ms-reto4-dev-events
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:   { condition: service_healthy }
      localstack: { condition: service_healthy }

  payment-service:
    build: ./services/payment
    ports: ["8084:8084"]
    environment:
      PORT: 8084
      DB_HOST: postgres
      DB_USER: dbadmin
      DB_PASSWORD: localdevpassword
      DB_NAME: microservicesdb
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:ms-reto4-dev-events
      STRIPE_SECRET_KEY: sk_test_mock_key_for_local_dev
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:   { condition: service_healthy }
      localstack: { condition: service_healthy }

  notification-service:
    build: ./services/notification
    ports: ["8085:8085"]
    environment:
      PORT: 8085
      DB_HOST: postgres
      DB_USER: dbadmin
      DB_PASSWORD: localdevpassword
      DB_NAME: microservicesdb
      NOTIFICATION_QUEUE_URL: http://localstack:4566/000000000000/ms-reto4-dev-notification-events
      SES_FROM_EMAIL: noreply@localhost
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:   { condition: service_healthy }
      localstack: { condition: service_healthy }

  # ── Local API Gateway (Nginx) ──────────────────
  gateway:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes:
      - ./docs/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service

volumes:
  pgdata:
  localstack_data:
