# docs/nginx-local.conf
# Local development proxy — simulates API Gateway routing
# Access all services via http://localhost:3000

server {
    listen 80;
    server_name localhost;

    # Health
    location /health {
        proxy_pass http://user-service:8081/health;
    }

    # Auth (no JWT enforcement locally)
    location /auth/ {
        proxy_pass         http://auth-service:8080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Request-ID    $request_id;
    }

    # User
    location /users/ {
        proxy_pass         http://user-service:8081/;
        proxy_set_header   Host $host;
        proxy_set_header   X-JWT-Subject   $http_x_jwt_subject;
        proxy_set_header   X-JWT-Email     $http_x_jwt_email;
        proxy_set_header   X-Request-ID    $request_id;
    }

    # Product
    location /products/ {
        proxy_pass         http://product-service:8082/;
        proxy_set_header   Host $host;
        proxy_set_header   X-JWT-Subject   $http_x_jwt_subject;
        proxy_set_header   X-JWT-Email     $http_x_jwt_email;
        proxy_set_header   X-Request-ID    $request_id;
    }

    # Order
    location /orders/ {
        proxy_pass         http://order-service:8083/;
        proxy_set_header   Host $host;
        proxy_set_header   X-JWT-Subject   $http_x_jwt_subject;
        proxy_set_header   X-JWT-Email     $http_x_jwt_email;
        proxy_set_header   X-Request-ID    $request_id;
    }

    # Payment
    location /payments/ {
        proxy_pass         http://payment-service:8084/;
        proxy_set_header   Host $host;
        proxy_set_header   X-JWT-Subject   $http_x_jwt_subject;
        proxy_set_header   X-JWT-Email     $http_x_jwt_email;
        proxy_set_header   X-Request-ID    $request_id;
    }

    # Notification
    location /notifications/ {
        proxy_pass         http://notification-service:8085/;
        proxy_set_header   Host $host;
        proxy_set_header   X-JWT-Subject   $http_x_jwt_subject;
        proxy_set_header   X-JWT-Email     $http_x_jwt_email;
        proxy_set_header   X-Request-ID    $request_id;
    }
}
