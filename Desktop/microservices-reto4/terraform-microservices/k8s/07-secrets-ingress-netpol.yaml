---
# k8s/07-secrets.yaml
# IMPORTANT: Do NOT commit real secrets. Use ExternalSecrets Operator
# or AWS Secrets Manager CSI Driver in production.
# This is a TEMPLATE — real values are injected by CI/CD or ESO.

apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  namespace: microservices
type: Opaque
stringData:
  jwt-secret: "REPLACE_WITH_STRONG_SECRET_256BIT"
  jwt-issuer: "https://your-auth-domain.auth0.com/"

---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: microservices
type: Opaque
stringData:
  host: "REPLACE_WITH_RDS_ENDPOINT"
  username: "dbadmin"
  password: "REPLACE_WITH_DB_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: microservices
type: Opaque
stringData:
  host: "REPLACE_WITH_REDIS_ENDPOINT"

---
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: microservices
type: Opaque
stringData:
  stripe-secret-key: "REPLACE_WITH_STRIPE_KEY"

---
# k8s/08-ingress.yaml
# AWS Load Balancer Controller creates NLB automatically
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: microservices
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-type: nlb
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: microservices
spec:
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8080
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8081
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 8082
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8083
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8084
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8085

---
# k8s/09-network-policies.yaml
# Deny all by default, allow only required traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: microservices
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-nlb
  namespace: microservices
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - port: 8080
        - port: 8081
        - port: 8082
        - port: 8083
        - port: 8084
        - port: 8085

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inter-service
  namespace: microservices
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: microservices
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: microservices
    - to: []   # allow egress to AWS services (SQS, S3, etc.)
      ports:
        - port: 443
