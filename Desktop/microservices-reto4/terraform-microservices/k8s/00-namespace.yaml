---
# k8s/00-namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: microservices
  labels:
    name: microservices
    env: prod

---
# k8s/00-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: microservices
data:
  LOG_LEVEL: "info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  AWS_REGION: "us-east-1"
  REDIS_PORT: "6379"
  DB_PORT: "5432"
  DB_NAME: "microservicesdb"

---
# k8s/00-hpa-defaults.yaml
# HPA template applied per-service; each service overrides min/max
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-defaults
  namespace: microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: placeholder
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
